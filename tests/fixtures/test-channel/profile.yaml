channel:
  name: "Test Channel"
  niche: "Testing / fixtures"
  audience: "Test audience"
  tone: "Neutral test tone"
  reference_channel: "test-channel.example.com"
  title_format: "Test title format"

script:
  target_mins: 12
  min_mins: 9
  max_mins: 15
  wpm: 160
  hook_duration_s: 35
  cta_duration_s: 30
  section_count: "10-14"
  section_duration_s: "60-90"

characters:
  roster:
    - name: "Test Cat"
      description: "a simple test cat with round head and dot eyes"
    - name: "Other Cat"
      description: "another simple test cat with triangle ears"
  behavior: |
    Alternate every 2-3 prompts. Cats hold objects and point at diagrams.

image_style:
  art_style_block: |
    flat 2D test illustration on off-white paper, bold black outlines
  sky_rotation: "sky blue → pale yellow → warm orange"
  anchor_priority:
    - anchor-01
    - anchor-02
  max_anchors: 2

voice:
  voice_id: "test-voice-id-123"
  model: "eleven_v3"
  stability: 0.68
  similarity_boost: 0.85
  style: 0.0
  use_speaker_boost: true
  tone_description: "Neutral test tone for unit tests."

image_gen:
  default_model: "gemini-3.1-flash-image"
  regen_model: "gemini-3.1-flash-image"
  pro_model: "gemini-3-pro-image"
