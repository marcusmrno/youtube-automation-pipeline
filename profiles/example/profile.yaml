# ── Channel identity ──────────────────────────────────────────────────────────
# Every field below flows into an LLM prompt. Nothing here is decorative —
# change a value and the scripts, narration, and images change with it.
channel:
  name: "Deep Field"
  niche: "astronomy and space science"
  audience: "curious adults who want the real physics, not awe-noises over stock footage"
  tone: "precise, unhurried, quietly astonished — explains scale without hyperbole"
  reference_channel: "PBS Space Time"
  title_format: "What [Object] Actually [Does] — And Why It Matters"

# ── Script settings ───────────────────────────────────────────────────────────
script:
  target_mins: 12
  min_mins: 10
  max_mins: 14
  wpm: 150
  hook_duration_s: 30
  cta_duration_s: 20
  section_count: 6
  section_duration_s: "90-120"

# ── Characters ────────────────────────────────────────────────────────────────
# Optional. Delete this whole block for a channel with no recurring characters —
# every character-specific instruction drops out of the prompts automatically.
characters:
  roster:
    - name: "The Surveyor"
      description: >
        A small figure in a rounded retro spacesuit, drawn as a flat two-tone
        screenprint shape. Bulbous fishbowl helmet with a single wide visor that
        reads as a solid dark oval — no face is ever visible. Boxy chest pack with
        two round dials. Stubby limbs, oversized boots. Rendered only in the
        channel's two ink colors with visible halftone dot texture. No outlines
        thinner than the ink registration allows.

  behavior: |
    ## Character behavior rules
    - The Surveyor observes, measures, or points — it never emotes, and its visor stays blank
    - Scale is the recurring joke: the figure is always dwarfed by whatever it is measuring
    - Props are limited to simple instruments — flags, tripods, tethers, hand lamps, rulers
    - The figure occupies less than 15% of the frame unless the narration is about human scale
    - Vary placement across images — never the same corner in more than 2 consecutive images

# ── Image style ───────────────────────────────────────────────────────────────
image_style:
  # Appended to every image prompt.
  art_style_block: |
    Two-color risograph screenprint. Exactly two inks: fluorescent orange (#FF6B35)
    and deep navy (#1B2A4A), overprinted where they meet to make a muddy plum. Heavy
    visible halftone dot texture in every fill — no smooth flats. Deliberate 1-2mm
    misregistration between the two ink layers. Coarse paper grain over the whole
    frame. Unbleached newsprint background (#EDE6D6) left bare for highlights.
    No gradients. No black. No photorealism. No digital smoothness. All text is
    condensed uppercase sans-serif in navy ink. 16:9 landscape composition.

  # Short hard-rule form of the style, sent AHEAD of every image prompt and every
  # anchor generation. Optional — omit it and the full art_style_block is used instead.
  style_constraints: >
    Two inks only: fluorescent orange and deep navy on unbleached newsprint. Visible
    halftone dots in every fill. Deliberate misregistration. No black, no gradients,
    no photorealism, no smooth digital shading, no third color.

  max_anchors: 6   # anchors passed as references per image call — higher = more consistent, more expensive

  scene_rules: |
    ## Composition
    - Every scene states its scale explicitly — a horizon, a grid, a tether, or a size-reference object
    - **Subject (primary):** one dominant celestial or instrument form per frame. Choose one per scene from: gas giant limb, ringed body, cratered moon surface, nebula filament, accretion disk, comet nucleus, spacecraft hull section, radio dish array, star field with one bright anchor star, planetary shadow terminator, asteroid cluster, solar prominence. Describe its silhouette and which ink fills it. Never reuse the same subject two scenes in a row.
    - **Ink balance (secondary):** alternate which ink dominates the frame — orange-dominant, then navy-dominant. Never the same dominant ink twice in a row.
    - Negative space: leave at least a quarter of the frame as bare newsprint. Always.

    **Forbidden:**
    - A scene with no explicit scale reference
    - Two consecutive scenes with the same dominant ink
    - Any third color, or pure black anywhere in the frame

    ## Text in image
    Whenever narration states a figure, distance, or name: set it as condensed uppercase
    navy type on a bare newsprint strip. Always write the exact words from the narration.

# ── Voice / TTS ───────────────────────────────────────────────────────────────
voice:
  voice_id: "${ELEVENLABS_VOICE_ID}"   # or hardcode: "abc123..."
  model: "eleven_v3"
  tone_description: >
    Measured and low-key — a researcher walking you through something they find
    genuinely remarkable. Unhurried pace, long pauses before big numbers. Never
    breathless, never awed-sounding. The scale does the work, not the delivery.
  stability: 0.65
  similarity_boost: 0.85
  style: 0.0
  use_speaker_boost: true

# ── Image generation ──────────────────────────────────────────────────────────
image_gen:
  default_model: "gemini-3.1-flash-image"
  pro_model: "gemini-3-pro-image"
  flicker:
    enabled: false      # set to true to generate b/c flicker frames per image
    magnitude: 0.004    # 0.4% stretch — adjust for more/less pronounced effect
