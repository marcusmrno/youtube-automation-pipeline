# ── Channel identity ──────────────────────────────────────────────────────────
channel:
  name: "Curious Critters"
  niche: "animal facts and nature science"
  audience: "curious adults who want surprising, well-researched facts"
  tone: "conversational, warm, occasionally dry humor — never condescending"
  reference_channel: "Kurzgesagt"
  title_format: "Why [Animal] Does [Surprising Thing] — The Science"

# ── Script settings ───────────────────────────────────────────────────────────
script:
  target_mins: 12
  min_mins: 10
  max_mins: 14
  wpm: 150
  hook_duration_s: 30
  cta_duration_s: 20
  section_count: 6
  section_duration_s: "90-120"

# ── Characters ────────────────────────────────────────────────────────────────
characters:
  roster:
    - name: "Orange Cat"
      description: >
        A large, round orange tabby cat with thick black marker outlines and blotchy
        orange fur filled with visible marker streaks. Wears a small black bowtie.
        Big expressive eyes with oval pupils. Stands upright on two legs at about
        human height. Slightly pudgy build. Always drawn in flat 2D with no shading.

    - name: "White Cat"
      description: >
        A small, fluffy white cat with thick black marker outlines and soft grey
        shading on the ears and tail tip. Wears a pink collar with a tiny bell.
        Has a grey patch over one eye. Big round eyes. Stands upright on two legs,
        noticeably shorter than Orange Cat. Always drawn in flat 2D with no shading.

  behavior: |
    ## Character behavior rules
    - Characters hold, point at, or physically demonstrate the fact being narrated
    - Characters never react emotionally to what is being said — no shocked faces, no thinking poses
    - Props are always flat 2D objects matching the art style — no 3D or photorealistic items
    - Never place both characters in the same scene unless the narration explicitly compares two things
    - Vary which character appears — never the same character in more than 3 consecutive images

# ── Image style ───────────────────────────────────────────────────────────────
image_style:
  art_style_block: |
    Flat 2D illustration. Bold uneven black marker outlines — lines vary in thickness
    and are slightly wobbly, not perfectly smooth. Color fills bleed slightly outside
    the outlines with visible marker streaks and texture. Off-white warm paper
    background (#F5F0E8). No gradients. No drop shadows. No photorealistic textures.
    No smooth digital lines. All text is bold handwritten uppercase in black marker.
    16:9 landscape composition.

  # Short hard-rule form of the style, sent AHEAD of every image prompt and every
  # anchor generation. Optional — omit it and the full art_style_block is used instead.
  style_constraints: >
    Bold uneven black marker outlines. Color fills bleed outside lines with visible
    marker streaks. Off-white warm paper background (#F5F0E8). No gradients. No drop
    shadows. No clean fonts. No photorealistic textures. No smooth digital lines.

  max_anchors: 6   # anchors passed as references per image call — higher = more consistent, more expensive

  scene_rules: |
    ## Environment
    - Always include a visible horizon line separating sky (top) from ground plane (bottom)
    - **Landscape/background (primary):** Every scene must include a named, described landscape. Choose one per scene from: rolling hills, rocky terrain, desert dunes, dense forest treeline, snowy mountain peaks, coastal cliffs, grassy plains, jungle canopy edge, volcanic rocks, canyon walls, city skyline silhouette, farmland rows, frozen tundra. Describe the landscape's silhouette shape and fill color. Never reuse the same landscape two scenes in a row.
    - **Sky (secondary — sits behind the landscape):** Rotate through pale yellow → soft coral → sky blue → mint green → lavender. Never the same sky color twice in a row.
    - Ground: flat solid color plane filling the bottom third. Always visible.
    - Characters always stand on the ground plane — never floating.

    **Forbidden:**
    - A scene with no described landscape type
    - Two consecutive scenes with the same landscape type

    ## Text in image
    Whenever narration states a fact, name, or stat: include it as exact bold handwritten uppercase marker text inside a grey rounded rectangle label box. Always write the exact words.

# ── Voice / TTS ───────────────────────────────────────────────────────────────
voice:
  voice_id: "${ELEVENLABS_VOICE_ID}"   # or hardcode: "abc123..."
  model: "eleven_v3"
  tone_description: >
    Warm and curious — like a knowledgeable friend sharing something fascinating.
    Naturally conversational pace with occasional dry wit. Never robotic or
    lecture-y. Genuine enthusiasm on reveals, not performed excitement.
  stability: 0.65
  similarity_boost: 0.85
  style: 0.0
  use_speaker_boost: true

# ── Image generation ──────────────────────────────────────────────────────────
image_gen:
  default_model: "gemini-3.1-flash-image"
  pro_model: "gemini-3-pro-image"
  flicker:
    enabled: false      # set to true to generate b/c flicker frames per image
    magnitude: 0.004    # 0.4% stretch — adjust for more/less pronounced effect
